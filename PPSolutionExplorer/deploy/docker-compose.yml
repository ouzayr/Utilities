# Local deployment. Everything binds to 127.0.0.1; nothing is exposed to the network.
#   docker compose -f deploy/docker-compose.yml up -d db            # database only (app runs natively)
#   docker compose -f deploy/docker-compose.yml up -d --build       # database + app (Linux, host networking)
#   docker compose -f deploy/docker-compose.yml --profile ai up -d  # + llama-server (see docs/DEPLOYMENT.md)
name: ppse

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ppse
      POSTGRES_USER: ppse
      POSTGRES_PASSWORD: ${PPSE_DB_PASSWORD:?Set PPSE_DB_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ppse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppse -d ppse"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Explorer: "Host=127.0.0.1;Port=5432;Database=ppse;Username=ppse;Password=${PPSE_DB_PASSWORD}"
      Ai__Enabled: ${PPSE_AI_ENABLED:-false}
      Ai__BaseUrl: http://127.0.0.1:8080
      Ai__Model: ${PPSE_AI_MODEL:-}

  llama:
    profiles: ["ai"]
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${PPSE_MODELS_DIR:-./models}:/models:ro
    command: >
      -m /models/${PPSE_MODEL_FILE:?Set PPSE_MODEL_FILE in deploy/.env}
      -c 32768 --parallel 2 -ngl ${PPSE_GPU_LAYERS:-0}
      --host 127.0.0.1 --port 8080

volumes:
  ppse-db:
