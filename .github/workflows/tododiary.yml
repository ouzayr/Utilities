name: ToDoDiary build

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'ToDoDiary/**'
      - '.github/workflows/tododiary.yml'
  workflow_dispatch:

jobs:
  android-apk:
    name: Android APK (signed release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        working-directory: ToDoDiary/android
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Build signed release APK
        working-directory: ToDoDiary/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToDoDiary-release-apk
          path: ToDoDiary/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

  web:
    name: Web app (Vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ToDoDiary/web/package-lock.json

      - name: Install
        working-directory: ToDoDiary/web
        run: npm ci

      - name: Build
        working-directory: ToDoDiary/web
        env:
          # Placeholder values so the production build compiles; real values
          # are injected at deploy time (see docs/AZURE-DEPLOY.md).
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:placeholder'
        run: npm run build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToDoDiary-web-dist
          path: ToDoDiary/web/dist
          if-no-files-found: error
          retention-days: 90
